name: Gold Signal Monitor 5m

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "gold_signal_monitor.py"
      - ".github/workflows/gold-signal-monitor.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: gold-signal-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Analizar oro
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_NOTIFICATION_TEST: ${{ github.event_name == 'push' && '1' || '0' }}
        run: python3 gold_signal_monitor.py

      - name: Guardar estado
        run: |
          if git diff --quiet -- gold_state.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gold_state.json
          git commit -m "chore: update gold monitor state"
          git push

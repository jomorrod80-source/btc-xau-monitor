name: BTC XAU Monitor 5m

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Trigger BTC XAU monitor
        shell: bash
        run: |
          set -euo pipefail

          response=$(curl --fail-with-body \
            --silent \
            --show-error \
            --retry 2 \
            --retry-delay 5 \
            --max-time 90 \
            -X POST \
            -H "Content-Type: application/json" \
            "https://mexc-mega-pump.hatchable.site/api/external-market-tick")

          echo "$response"
